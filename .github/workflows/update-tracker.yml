name: Update NBA tracker

on:
  schedule:
    - cron: "17 14 * * *"   # 8:17 AM Central, after last night's games settle
    - cron: "17 20 * * *"   # 2:17 PM Central, retries anything still pending
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - name: Install
        run: pip install -r tracker/requirements.txt

      - name: Run tracker
        run: python tracker/update.py

      - name: Save results
        run: |
          git config user.name "nba-tracker-bot"
          git config user.email "nba-tracker-bot@users.noreply.github.com"
          git add data/tracker.json tracker/season_games.csv
          if git diff --cached --quiet; then
            echo "No new games."
          else
            git commit -m "Tracker: update $(date -u +%Y-%m-%d)"
            git push
          fi
